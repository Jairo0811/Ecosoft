services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-CU20-ubuntu-22.04
    environment:
      ACCEPT_EULA: 'Y'
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:-YourStrong!Passw0rd}
    # Local edition only: published on loopback so the database is not reachable from the LAN.
    ports:
      - '127.0.0.1:14330:1433'
    volumes:
      - ecosoft-sqlserver:/var/opt/mssql
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$${MSSQL_SA_PASSWORD}" -C -Q 'SELECT 1' || exit 1
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s

  ai-service:
    build: ./apps/ai-service
    # Internal service consumed only by the API (AI_SERVICE_URL=http://localhost:8000).
    # Loopback binding keeps it off external networks; it has no authentication of its own.
    ports:
      - '127.0.0.1:8000:8000'
    healthcheck:
      test:
        [
          'CMD',
          'python',
          '-c',
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')",
        ]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  ecosoft-sqlserver:
