name: Update enterprise README

on:
  push:
    branches:
      - feature/enterprise-phases-11-18

permissions:
  contents: write

jobs:
  update-readme:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/enterprise-phases-11-18
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Update Enterprise status
        shell: python
        run: |
          from pathlib import Path

          path = Path('README.md')
          text = path.read_text(encoding='utf-8')

          replacements = {
              '  Plataforma SaaS para digitalizar, administrar, supervisar y auditar procesos energéticos de la Comisión Nacional de Energía.':
                  '  Plataforma SaaS para digitalizar, administrar, supervisar y auditar procesos regulados del sector energético.',
              '  <img src="https://img.shields.io/badge/estado-MVP_completo-18A96F?style=for-the-badge" alt="MVP completo">':
                  '  <img src="https://img.shields.io/badge/estado-Enterprise_MVP_%C2%B7_Pilot_Ready-18A96F?style=for-the-badge" alt="Enterprise MVP · Pilot Ready">',
              '  <img src="https://img.shields.io/badge/fases-0_a_10-18A96F" alt="Fases 0 a 10 implementadas">':
                  '  <img src="https://img.shields.io/badge/roadmap-fases_0_a_18-18A96F" alt="Roadmap fases 0 a 18">',
              '> 🎓 Proyecto académico de **Proyecto de Software 1 (ISO-705)**, desarrollado por el **Grupo #4** de la **Universidad APEC (UNAPEC)** para el caso de estudio de **EcoSoft Solutions S.R.L.** y la **Comisión Nacional de Energía (CNE)**.':
                  '> 🎓 Proyecto académico de **Proyecto de Software 1 (ISO-705)**, desarrollado por el **Grupo #4** de la **Universidad APEC (UNAPEC)** para el caso de estudio de **EcoSoft Solutions S.R.L.** y la **Comisión Nacional de Energía (CNE)**.\n>\n> 🏢 Su evolución posterior se documenta como **EcoSoft Enterprise**, preservando el linaje académico y preparando una edición **Enterprise MVP / Pilot Ready** para autoridades, operadores y organizaciones del sector energético. Consulta [`docs/enterprise/`](docs/enterprise/README.md).',
              'Las **Fases 0 a 10** están implementadas como un MVP integral. La entrega incluye dominio,\nautorización, interfaz, migraciones, pruebas, documentación y CI; la publicación en infraestructura\nproductiva y los adaptadores cloud requieren credenciales y aprobación del operador.':
                  'Las **Fases 0 a 10** están implementadas como un MVP integral. Las **Fases 11 a 18** añaden la\nproductización Enterprise: baseline de seguridad, identidad empresarial configurable, estrategia de\ntenancy, observabilidad, contratos de integración, gates de cumplimiento/escala y plan de piloto.\nLas capacidades que dependen de infraestructura o proveedores externos se mantienen como\n`Foundation` hasta existir credenciales y evidencia real; por eso el estado correcto es\n**Enterprise MVP / Pilot Ready**, no Production Ready.',
              '|   10 | Hardening, QA, accesibilidad, CI/CD y documentación | ✅ Implementada |':
                  '|   10 | Hardening, QA, accesibilidad, CI/CD y documentación | ✅ Implementada |\n|   11 | Productization                                     | ✅ Implementada |\n|   12 | Production Security                                | ✅ Implementada |\n|   13 | Enterprise Identity                                | 🧱 Foundation   |\n|   14 | Multi-Organization                                 | 🧱 Foundation   |\n|   15 | Cloud & Observability                              | 🧱 Foundation   |\n|   16 | Integrations                                       | 🧱 Foundation   |\n|   17 | Compliance & Scale                                 | 🧱 Foundation   |\n|   18 | Commercial Pilot                                   | ✅ Implementada |',
              '| [ADRs](docs/architecture/)                  | Decisiones de arquitectura documentadas      |':
                  '| [ADRs](docs/architecture/)                  | Decisiones de arquitectura documentadas      |\n| [EcoSoft Enterprise](docs/enterprise/README.md) | Productización, fases 11–18 y gates productivos |',
          }

          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f'Replacement target not found: {old[:80]!r}')
              text = text.replace(old, new, 1)

          path.write_text(text, encoding='utf-8')
      - run: npx prettier --write README.md
      - name: Commit README
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "docs: present Enterprise phases 11-18 in README"
          git push origin HEAD:feature/enterprise-phases-11-18
